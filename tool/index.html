<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔮 無料パーソナル占卜 - 2027年運勢</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
<div class="nav-inner">
<div>
<a href="/ja/index.html">ホーム</a>
<a href="#" class="active">無料占卜</a>
</div>
<div class="lang-switch">
<a href="?lang=ja">JA</a>
<a href="?lang=zh">ZH</a>
<a href="?lang=en">EN</a>
</div>
</div>
</nav>
<div class="container">
<header>
<h1>🔮 無料パーソナル占卜</h1>
<p>生年月日を入力するだけで、あなたの2027年運勢を診断します</p>
</header>

<div class="card">
<div style="text-align:center; margin: 20px 0;">
<label for="birthdate" style="display:block; margin-bottom:10px; font-size:1.1rem;">生年月日</label>
<input type="date" id="birthdate" style="padding:12px; font-size:1rem; border-radius:8px; border:1px solid var(--border); background:var(--bg-card); color:var(--text); width:200px; text-align:center;">
<br><br>
<button onclick="generateFortune()" style="padding:15px 40px; font-size:1.1rem; background:linear-gradient(135deg, var(--primary), var(--accent)); color:white; border:none; border-radius:25px; cursor:pointer;">占卜を見る</button>
</div>
</div>

<div id="result" class="card" style="display:none;"></div>

<div class="ad-placeholder">
Google AdSense 広告表示予定地
</div>

<p style="text-align:center;"><a href="/ja/index.html">← ホームに戻る</a></p>
</div>
<footer>
© 2027 Fortune Insights. 運命を知り、未来を作る。
</footer>
<script src="/js/fortune.js"></script>
<script>
// URLパラメタから言語を取得
const urlParams = new URLSearchParams(window.location.search);
const lang = urlParams.get('lang') || 'ja';
document.documentElement.lang = lang;

// 言語によってページテキストを変更
const i18n = {
  ja: { title: '無料パーソナル占卜 - 2027年運勢', desc: '生年月日を入力するだけで、あなたの2027年運勢を診断します', label: '生年月日', btn: '占卜を見る', back: '← ホームに戻る', home: '/ja/index.html' },
  zh: { title: '免费个人占卜 - 2027年运势', desc: '输入出生年月日，即可获得你的2027年运势解读', label: '出生年月日', btn: '查看占卜', back: '← 返回首页', home: '/zh/index.html' },
  en: { title: 'Free Personal Fortune - 2027 Reading', desc: 'Enter your birthdate to discover your zodiac sign and life path number.', label: 'Birthdate', btn: 'Get My Fortune', back: '← Back to Home', home: '/en/index.html' }
};
const t = i18n[lang] || i18n.ja;
document.title = '🔮 ' + t.title;
document.querySelector('header h1').textContent = '🔮 ' + t.title;
document.querySelector('header p').textContent = t.desc;
document.querySelector('label[for="birthdate"]').textContent = t.label;
document.querySelector('button[onclick="generateFortune()"]').textContent = t.btn;
document.querySelector('p a').textContent = t.back;
document.querySelector('p a').href = t.home;

// ナビゲーションのホームリンクも変更
document.querySelector('nav a:not(.active)').href = t.home;
</script>
</body>
</html>
